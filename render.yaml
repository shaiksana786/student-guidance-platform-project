databases:
  - name: guidance-platform-db
    databaseName: guidance_platform
    user: guidance_platform
    plan: free

services:
  - type: web
    name: guidance-platform-9pn9
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd student-guidance-platform--main/student_guidance && python manage.py migrate && gunicorn student_guidance_config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guidance-platform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: guidance-platform-9pn9.onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://guidance-platform-9pn9.onrender.com